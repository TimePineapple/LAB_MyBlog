spring.application.name=myblog
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 只从环境变量获得凭据；不会自动运行建表、播种脚本。
spring.datasource.url=${MYBLOG_DB_URL:jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYBLOG_DB_USERNAME}
spring.datasource.password=${MYBLOG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
logging.level.com.myblog.mapper=DEBUG
